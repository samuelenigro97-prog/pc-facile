name: Release package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da pubblicare (es. v7.6)
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica hash
        shell: pwsh
        run: |
          $reale = (Get-FileHash './setup-pc.ps1' -Algorithm SHA256).Hash.ToLower()
          $atteso = (Get-Content './setup-pc.ps1.sha256' -Raw).Trim().ToLower()
          if ($reale -ne $atteso) { throw 'SHA256 non aggiornato' }
          $coreReale = (Get-FileHash './src/PcFacile.Core.psm1' -Algorithm SHA256).Hash.ToLower()
          $coreAtteso = (Get-Content './src/PcFacile.Core.psm1.sha256' -Raw).Trim().ToLower()
          if ($coreReale -ne $coreAtteso) { throw 'SHA256 modulo non aggiornato' }
      - name: Crea pacchetto
        shell: pwsh
        run: Compress-Archive -Path './PC Facile.bat','./setup-pc.ps1','./setup-pc.ps1.sha256','./src','./LEGGIMI.md' -DestinationPath './PC-Facile-${{ inputs.tag }}.zip'
      - name: Pubblica release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create '${{ inputs.tag }}' './PC-Facile-${{ inputs.tag }}.zip' './setup-pc.ps1.sha256' --generate-notes
